<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D9488"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97706"/>
    </marker>
    <style>
      .box{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}
      .t{font-size:16px;font-weight:700;fill:#0F172A}
      .s{font-size:12.5px;fill:#475569}
      .p{font-size:11.5px;fill:#64748B;font-family:"DejaVu Sans Mono",monospace}
      .flow{stroke:#64748B;stroke-width:2;fill:none;marker-end:url(#arr)}
      .priv{stroke:#0D9488;stroke-width:2.5;fill:none;marker-end:url(#arrT)}
      .ext{stroke:#D97706;stroke-width:2.5;fill:none;marker-end:url(#arrA)}
      .lbl{font-size:11.5px;fill:#334155;font-weight:600}
    </style>
  </defs>

  <rect width="1200" height="700" fill="#F8FAFC"/>
  <text x="40" y="44" font-size="22" font-weight="800" fill="#0F172A">TPRM-AI · Architecture</text>
  <text x="40" y="68" font-size="13.5" fill="#64748B">Everything runs locally in Docker Compose. Only anonymized text crosses the trust boundary.</text>

  <!-- local zone -->
  <rect x="30" y="90" width="860" height="580" rx="16" fill="#EEF6FF" stroke="#93C5FD" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="50" y="118" font-size="13" font-weight="700" fill="#1D4ED8">LOCAL HOST · Docker Compose network (no personal data leaves this box)</text>

  <!-- trust boundary -->
  <line x1="920" y1="90" x2="920" y2="670" stroke="#D97706" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="930" y="112" font-size="12" font-weight="700" fill="#B45309">TRUST BOUNDARY</text>

  <!-- input -->
  <rect class="box" x="55" y="145" width="170" height="92" rx="12"/>
  <text class="t" x="70" y="172">📂 Vendor docs</text>
  <text class="s" x="70" y="194">ISO 27001, SOC 2, DPA,</text>
  <text class="s" x="70" y="211">BCP, pentest, questionnaires</text>
  <text class="p" x="70" y="228">n8n-files/input/*.pdf</text>

  <!-- ocr -->
  <rect class="box" x="55" y="300" width="170" height="80" rx="12"/>
  <text class="t" x="70" y="327">🔎 ocr-api</text>
  <text class="s" x="70" y="348">Tesseract (spa+eng)</text>
  <text class="p" x="70" y="367">FastAPI · :8000</text>

  <!-- n8n -->
  <rect x="275" y="145" width="250" height="235" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text class="t" x="292" y="172">⚙️ n8n orchestrator</text>
  <text class="p" x="292" y="192">:5678</text>
  <g class="s">
    <text x="292" y="218">1 · extract text / OCR fallback</text>
    <text x="292" y="240">2 · anonymize (Presidio)</text>
    <text x="292" y="262">3 · build prompt (system + doc)</text>
    <text x="292" y="284">4 · call LLM</text>
    <text x="292" y="306">5 · clean JSON + de-anonymize</text>
    <text x="292" y="328">6 · deterministic scoring</text>
    <text x="292" y="350">7 · persist + CSV inventory</text>
  </g>

  <!-- presidio -->
  <rect x="600" y="145" width="270" height="150" rx="12" fill="#ECFDF5" stroke="#5EEAD4" stroke-width="1.5"/>
  <text class="t" x="614" y="172">🛡️ presidio-es</text>
  <text class="s" x="614" y="194">Modified Microsoft Presidio · spaCy es</text>
  <text class="s" x="614" y="214">COMPANY · PERSON · LOCATION · CIF/NIF</text>
  <text class="s" x="614" y="232">IBAN · phone · email · TPRM denylist</text>
  <text class="p" x="614" y="256">POST /anonymize → text + mapping</text>
  <text class="p" x="614" y="276">:5002 · FastAPI</text>

  <!-- postgres -->
  <rect class="box" x="275" y="440" width="250" height="140" rx="12"/>
  <text class="t" x="292" y="467">🐘 PostgreSQL 16</text>
  <text class="s" x="292" y="490">vendors (UPSERT + COALESCE)</text>
  <text class="s" x="292" y="510">anonymized_documents</text>
  <text class="s" x="292" y="530">  ↳ entity_mapping (never leaves)</text>
  <text class="s" x="292" y="550">risks · audit_log · calendar_events</text>
  <text class="p" x="292" y="570">:5432 · also n8n backend</text>

  <!-- RAG -->
  <rect x="575" y="440" width="290" height="140" rx="12" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="t" x="592" y="467">🧠 RAG layer</text>
  <rect x="740" y="452" width="112" height="22" rx="11" fill="#EDE9FE"/>
  <text x="796" y="467" text-anchor="middle" font-size="11" font-weight="700" fill="#6D28D9">IN PROGRESS</text>
  <text class="s" x="592" y="492">Qdrant · docs + assessments collections</text>
  <text class="s" x="592" y="512">TEI · multilingual-e5-large (1024d)</text>
  <text class="s" x="592" y="532">historical context for the prompt</text>
  <text class="p" x="592" y="560">:6333 · :8080</text>

  <!-- CSV -->
  <rect class="box" x="55" y="470" width="170" height="80" rx="12"/>
  <text class="t" x="70" y="497">📊 Inventory</text>
  <text class="s" x="70" y="518">inventario_vendors.csv</text>
  <text class="p" x="70" y="537">score · tier · result</text>

  <!-- LLM -->
  <rect x="950" y="200" width="220" height="150" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text class="t" x="968" y="228">☁️ LLM (OpenRouter)</text>
  <text class="s" x="968" y="252">Llama 3.3 70B Instruct</text>
  <text class="s" x="968" y="274">sees only placeholders:</text>
  <text class="p" x="968" y="296">&lt;COMPANY_001&gt; &lt;EMAIL_001&gt;</text>
  <text class="p" x="968" y="314">&lt;PERSON_001&gt; &lt;LOCATION_002&gt;</text>
  <text class="s" x="968" y="337">swappable for local Ollama</text>

  <!-- flows -->
  <path class="flow" d="M225 190 H272"/>
  <path class="flow" d="M290 380 C 240 400, 220 360, 225 345" />
  <path class="flow" d="M140 300 V240"/>
  <path class="priv" d="M525 200 H597"/>
  <text class="lbl" x="530" y="192">raw text</text>
  <path class="priv" d="M597 255 H528"/>
  <text class="lbl" x="531" y="247">anon + map</text>
  <path class="ext" d="M525 300 C 700 330, 850 350, 948 300"/>
  <text class="lbl" x="760" y="340" fill="#B45309">anonymized text only</text>
  <path class="ext" d="M1010 198 V128 H545 Q535 128 535 140 V160 H528" />
  <text class="lbl" x="640" y="121" fill="#B45309">JSON assessment (still placeholders)</text>
  <path class="flow" d="M400 380 V437"/>
  <path class="flow" d="M525 400 C 600 410, 640 420, 680 437" stroke-dasharray="5 4"/>
  <path class="flow" d="M275 510 H228"/>

  <!-- legend -->
  <g font-size="12" fill="#334155">
    <line x1="950" y1="430" x2="990" y2="430" stroke="#0D9488" stroke-width="2.5"/><text x="998" y="434">sensitive data (local only)</text>
    <line x1="950" y1="458" x2="990" y2="458" stroke="#D97706" stroke-width="2.5"/><text x="998" y="462">crosses trust boundary</text>
    <line x1="950" y1="486" x2="990" y2="486" stroke="#64748B" stroke-width="2"/><text x="998" y="490">internal flow</text>
    <rect x="950" y="502" width="40" height="18" rx="4" fill="none" stroke="#A78BFA" stroke-dasharray="5 4"/><text x="998" y="516">in progress</text>
  </g>
</svg>
