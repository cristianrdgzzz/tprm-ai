<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#102A43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E3A5F" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- shield -->
  <g transform="translate(90,70)">
    <path d="M90 0 L170 30 V95 C170 145 135 175 90 190 C45 175 10 145 10 95 V30 Z"
          fill="#0F2742" stroke="url(#accent)" stroke-width="5"/>
    <g font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#5EEAD4">
      <rect x="28" y="62" width="124" height="22" rx="5" fill="#134E4A"/>
      <text x="90" y="78" text-anchor="middle">&lt;COMPANY_001&gt;</text>
      <rect x="28" y="94" width="124" height="22" rx="5" fill="#1E3A8A"/>
      <text x="90" y="110" text-anchor="middle" fill="#93C5FD">&lt;EMAIL_001&gt;</text>
      <rect x="28" y="126" width="124" height="22" rx="5" fill="#134E4A"/>
      <text x="90" y="142" text-anchor="middle">&lt;PERSON_001&gt;</text>
    </g>
  </g>

  <g font-family="Inter, DejaVu Sans, sans-serif">
    <text x="320" y="135" font-size="64" font-weight="800" fill="#F8FAFC">TPRM<tspan fill="url(#accent)">-AI</tspan></text>
    <text x="322" y="180" font-size="24" font-weight="500" fill="#CBD5E1">Privacy-first, AI-assisted Third-Party Risk Management</text>
    <text x="322" y="214" font-size="18" fill="#94A3B8">Vendor documents in → anonymized locally → LLM assessment → scored vendor inventory</text>
    <g font-size="15" font-weight="600">
      <rect x="322" y="240" width="150" height="32" rx="16" fill="#134E4A"/>
      <text x="397" y="261" text-anchor="middle" fill="#5EEAD4">100% self-hosted</text>
      <rect x="484" y="240" width="170" height="32" rx="16" fill="#1E3A8A"/>
      <text x="569" y="261" text-anchor="middle" fill="#93C5FD">GDPR-aware by design</text>
      <rect x="666" y="240" width="200" height="32" rx="16" fill="#3B1F5E"/>
      <text x="766" y="261" text-anchor="middle" fill="#D8B4FE">ISO 27001 · ENS · RGPD</text>
      <rect x="878" y="240" width="170" height="32" rx="16" fill="#422006"/>
      <text x="963" y="261" text-anchor="middle" fill="#FCD34D">Spanish-native PII</text>
    </g>
  </g>
</svg>
